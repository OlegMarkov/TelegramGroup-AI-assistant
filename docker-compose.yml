services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Always production regardless of what NODE_ENV is set to in the local
      # .env file used for dev, so logs are always structured JSON here.
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    # BullMQ worker close() + Telegraf's polling stop need a moment; the
    # Docker default (10s) can cut that close under load.
    stop_grace_period: 15s

volumes:
  redis-data:
